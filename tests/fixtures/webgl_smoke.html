<!doctype html>
<meta charset="utf-8">
<title>WEBGL_PENDING</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 20% 10%, #38506f, #111827 58%, #06080d);
    color: #f8fafc;
    font: 600 22px system-ui, sans-serif;
  }
  main { display: grid; gap: 18px; justify-items: center; }
  canvas {
    width: min(72vw, 900px);
    height: min(58vh, 600px);
    border: 1px solid rgb(255 255 255 / 24%);
    border-radius: 24px;
    box-shadow: 0 24px 70px rgb(0 0 0 / 40%);
  }
  output { letter-spacing: .04em; }
</style>
<main>
  <canvas width="900" height="600"></canvas>
  <output>Testing the Chromium WebGL compositor…</output>
</main>
<script>
  const canvas = document.querySelector('canvas');
  const output = document.querySelector('output');
  const gl = canvas.getContext('webgl', { antialias: true });
  const suffix = new URLSearchParams(location.search).get('tab') || '1';

  function fail(message) {
    document.title = `WEBGL_FAIL_${suffix}`;
    output.textContent = `WebGL failed: ${message}`;
    output.style.color = '#fecaca';
  }

  if (!gl) {
    fail('context unavailable');
  } else {
    const vertex = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertex, `
      attribute vec2 position;
      varying vec2 uv;
      void main() {
        uv = position * 0.5 + 0.5;
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `);
    gl.compileShader(vertex);

    const fragment = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragment, `
      precision mediump float;
      varying vec2 uv;
      void main() {
        gl_FragColor = vec4(0.08 + uv.x * 0.18, 0.58 + uv.y * 0.28,
                            0.82, 1.0);
      }
    `);
    gl.compileShader(fragment);

    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      fail(gl.getProgramInfoLog(program) || 'shader link failed');
    } else {
      const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
      gl.useProgram(program);
      const location = gl.getAttribLocation(program, 'position');
      gl.enableVertexAttribArray(location);
      gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.finish();

      const pixel = new Uint8Array(4);
      gl.readPixels(canvas.width / 2, canvas.height / 2, 1, 1,
                    gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      if (gl.getError() !== gl.NO_ERROR || pixel[3] !== 255 || pixel[2] < 150) {
        fail(`unexpected framebuffer pixel ${Array.from(pixel).join(',')}`);
      } else {
        document.title = `WEBGL_OK_${suffix}`;
        output.textContent = `WebGL compositor OK · tab ${suffix}`;
        output.style.color = '#a7f3d0';
      }
    }
  }
</script>
