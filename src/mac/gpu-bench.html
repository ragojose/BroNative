<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPU Benchmark and Feature Check</title>
<style>
  body { font-family: -apple-system, Menlo, monospace; margin: 2rem; max-width: 720px; }
  h1 { font-size: 1.2rem; }
  table { border-collapse: collapse; margin: 1rem 0; }
  td, th { border: 1px solid #999; padding: 4px 10px; text-align: left; font-size: 0.9rem; }
  .ok { color: #0a7a0a; } .no { color: #b00020; }
  #log { white-space: pre-wrap; background: #f4f4f4; padding: 10px; font-size: 0.85rem; }
  button { font-size: 1rem; padding: 6px 14px; }
  canvas { border: 1px solid #999; margin-right: 8px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #ddd; }
    #log { background: #2a2a2a; }
    td, th { border-color: #555; }
    .ok { color: #4caf50; } .no { color: #ff5c5c; }
  }
</style>
</head>
<body>
<h1>GPU Benchmark and Feature Check (self-contained, no network)</h1>
<div>
  <canvas id="cv-webgl" width="64" height="64"></canvas>
  <canvas id="cv-webgl2" width="64" height="64"></canvas>
</div>
<table id="features"><tr><th>Check</th><th>Status</th></tr></table>
<button id="run">Run checks</button>
<div id="log"></div>
<script>
"use strict";

const logEl = document.getElementById("log");
function log(s) { logEl.textContent += s + "\n"; }

const rows = [];
function feat(name, val, note) { rows.push([name, !!val, note || ""]); }
function renderTable() {
  const table = document.getElementById("features");
  while (table.rows.length > 1) table.deleteRow(1);
  for (const [name, ok, note] of rows) {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"); td1.textContent = name;
    const td2 = document.createElement("td");
    td2.textContent = (ok ? "yes" : "no") + (note ? " " + note : "");
    td2.className = ok ? "ok" : "no";
    tr.append(td1, td2); table.append(tr);
  }
}

/* ---- WebGL: create a context, draw a triangle covering the center, read it back ---- */

function testWebGL(kind) {
  const out = { ok: false, renderer: "", error: "" };
  try {
    const canvas = document.getElementById(kind === "webgl2" ? "cv-webgl2" : "cv-webgl");
    const gl = canvas.getContext(kind, { antialias: false, preserveDrawingBuffer: true });
    if (!gl) { out.error = "context creation returned null"; return out; }

    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    out.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
                       : gl.getParameter(gl.RENDERER);

    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }");
    gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, "precision mediump float; void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }");
    gl.compileShader(fs);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      out.error = "program link failed: " + gl.getProgramInfoLog(prog);
      return out;
    }
    gl.useProgram(prog);

    // One triangle covering all of clip space.
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const px = new Uint8Array(4);
    gl.readPixels(32, 32, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const err = gl.getError();
    if (err !== gl.NO_ERROR) { out.error = "GL error 0x" + err.toString(16); return out; }
    if (px[0] !== 255 || px[1] !== 0 || px[2] !== 0 || px[3] !== 255) {
      out.error = "readPixels got [" + px.join(",") + "], expected [255,0,0,255]";
      return out;
    }
    out.ok = true;
  } catch (e) {
    out.error = String(e);
  }
  return out;
}

/* ---- WebGPU: adapter -> device -> compute doubling + render-pass clear readback ---- */

async function testWebGPU() {
  const out = { ok: false, compute: false, render: false, fallback: null,
                adapter: "", error: "" };
  try {
    if (!navigator.gpu) { out.error = "navigator.gpu missing"; return out; }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { out.error = "requestAdapter() returned null"; return out; }

    let info = adapter.info;
    if (!info && adapter.requestAdapterInfo) info = await adapter.requestAdapterInfo();
    out.adapter = info ? [info.vendor, info.architecture, info.device, info.description]
                           .filter(Boolean).join(" / ") : "(no adapter info)";
    out.fallback = "isFallbackAdapter" in adapter ? adapter.isFallbackAdapter
                 : (info && "isFallbackAdapter" in info ? info.isFallbackAdapter : null);

    const device = await adapter.requestDevice();
    device.pushErrorScope("validation");

    // Compute: double each element of a 64-element u32 buffer.
    const N = 64;
    const input = new Uint32Array(N);
    for (let i = 0; i < N; i++) input[i] = i * 3 + 1;
    const storage = device.createBuffer({
      size: input.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(storage, 0, input);
    const module = device.createShaderModule({ code: `
      @group(0) @binding(0) var<storage, read_write> data: array<u32>;
      @compute @workgroup_size(64)
      fn main(@builtin(global_invocation_id) id: vec3u) {
        if (id.x < ${N}u) { data[id.x] = data[id.x] * 2u; }
      }` });
    const pipeline = device.createComputePipeline({
      layout: "auto",
      compute: { module: module, entryPoint: "main" },
    });
    const bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: storage } }],
    });
    const computeRead = device.createBuffer({
      size: input.byteLength,
      usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
    });

    // Render: clear a 64x64 texture to green, copy to a buffer, read back.
    // Width 64 keeps bytesPerRow (256) at the required alignment.
    const tex = device.createTexture({
      size: [64, 64],
      format: "rgba8unorm",
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });
    const renderRead = device.createBuffer({
      size: 256 * 64,
      usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
    });

    const encoder = device.createCommandEncoder();
    const cpass = encoder.beginComputePass();
    cpass.setPipeline(pipeline);
    cpass.setBindGroup(0, bindGroup);
    cpass.dispatchWorkgroups(1);
    cpass.end();
    encoder.copyBufferToBuffer(storage, 0, computeRead, 0, input.byteLength);
    const rpass = encoder.beginRenderPass({
      colorAttachments: [{
        view: tex.createView(),
        loadOp: "clear",
        storeOp: "store",
        clearValue: { r: 0, g: 1, b: 0, a: 1 },
      }],
    });
    rpass.end();
    encoder.copyTextureToBuffer({ texture: tex },
        { buffer: renderRead, bytesPerRow: 256 }, [64, 64]);
    device.queue.submit([encoder.finish()]);

    const validationError = await device.popErrorScope();
    if (validationError) { out.error = "validation: " + validationError.message; return out; }

    await computeRead.mapAsync(GPUMapMode.READ);
    const result = new Uint32Array(computeRead.getMappedRange());
    out.compute = input.every((v, i) => result[i] === v * 2);
    if (!out.compute) out.error = "compute readback mismatch";
    computeRead.unmap();

    await renderRead.mapAsync(GPUMapMode.READ);
    const px = new Uint8Array(renderRead.getMappedRange(), 0, 4);
    out.render = px[0] === 0 && px[1] === 255 && px[2] === 0 && px[3] === 255;
    if (!out.render && !out.error) {
      out.error = "render readback got [" + Array.from(px).join(",") + "], expected [0,255,0,255]";
    }
    renderRead.unmap();
    device.destroy();

    out.ok = out.compute && out.render;
  } catch (e) {
    out.error = String(e);
  }
  return out;
}

/* ---- Driver ---- */

function isSoftwareRenderer(s) {
  return /swiftshader|software|llvmpipe/i.test(s || "");
}

async function runChecks() {
  rows.length = 0;
  logEl.textContent = "";
  document.title = "GPUBENCH RUNNING";

  const gl1 = testWebGL("webgl");
  const gl2 = testWebGL("webgl2");
  const timeout = new Promise((resolve) =>
      setTimeout(() => resolve({ ok: false, compute: false, render: false,
                                 fallback: null, adapter: "", error: "timed out after 15s" }), 15000));
  const gpu = await Promise.race([testWebGPU(), timeout]);

  const renderer = gl2.renderer || gl1.renderer || "";
  const hw = !isSoftwareRenderer(renderer) && gpu.fallback !== true &&
             !isSoftwareRenderer(gpu.adapter);

  feat("WebGL 1 (triangle drawn + read back)", gl1.ok, gl1.error);
  feat("WebGL 2 (triangle drawn + read back)", gl2.ok, gl2.error);
  feat("WebGPU compute (doubling verified)", gpu.compute, gpu.error);
  feat("WebGPU render pass (clear read back)", gpu.render);
  feat("Hardware accelerated (no software fallback)", hw,
       hw ? "" : "(software renderer detected)");
  renderTable();

  log("WebGL renderer: " + (renderer || "(unavailable)"));
  if (gl1.renderer && gl1.renderer !== renderer) log("WebGL 1 renderer: " + gl1.renderer);
  log("WebGPU adapter: " + (gpu.adapter || "(unavailable)"));
  log("WebGPU fallback adapter: " + (gpu.fallback === null ? "(unknown)" : gpu.fallback));
  if (gl1.error) log("WebGL 1 error: " + gl1.error);
  if (gl2.error) log("WebGL 2 error: " + gl2.error);
  if (gpu.error) log("WebGPU error: " + gpu.error);
  log("");
  log("userAgent: " + navigator.userAgent);

  const pass = gl1.ok && gl2.ok && gpu.ok && hw;
  // Machine-readable summary (read via the DevTools protocol for automated verification)
  document.title = "GPUBENCH " + (pass ? "PASS" : "FAIL") +
      " webgl=" + (gl1.ok ? 1 : 0) +
      " webgl2=" + (gl2.ok ? 1 : 0) +
      " webgpu=" + (gpu.ok ? 1 : 0) +
      " hw=" + (hw ? 1 : 0) +
      " renderer=" + (renderer || "unavailable");
}

document.getElementById("run").onclick = runChecks;

if (location.hash === "#autorun") {
  window.addEventListener("load", () => setTimeout(runChecks, 0));
}
</script>
</body>
</html>
