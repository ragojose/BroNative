name: Build DMG

on:
  push:
    branches: [main]
  # Build PRs too, so a compile break is caught before it reaches main. The
  # publish steps below are all gated on main, so PR runs stop after the build.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dmg-${{ github.ref }}
  # Superseded PR builds are worth cancelling. Main builds are not: cancelling
  # one mid-publish can leave a release created but never referenced by the
  # appcast, and the next run cannot clean it up.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CEF_VERSION: cef_binary_151.3.14+g5d67476+chromium-151.0.7922.72_macosarm64_minimal

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: CFBundleVersion is the commit count, and a shallow
          # clone would report 1 on every build, which stops Sparkle from ever
          # seeing a newer version.
          fetch-depth: 0

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: cef-project/third_party/cef
          key: cef-${{ env.CEF_VERSION }}

      - name: Download CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cef-project/third_party/cef
          cd cef-project/third_party/cef
          url="https://cef-builds.spotifycdn.com/$(printf '%s' "$CEF_VERSION" | sed 's/+/%2B/g').tar.bz2"
          curl -fL --retry 3 -o cef.tar.bz2 "$url"
          tar xjf cef.tar.bz2
          rm cef.tar.bz2

      - name: Install ninja
        run: brew install ninja

      - name: Configure
        run: cmake -G Ninja -B build

      - name: Build
        run: cmake --build build

      - name: Resolve version
        id: version
        run: |
          app="build/Bro Computer.app"
          short=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          build=$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$short-$build" >> "$GITHUB_OUTPUT"
          echo "dmg=Bro-Computer-$short-$build.dmg" >> "$GITHUB_OUTPUT"
          echo "Version $short (build $build)"

      # A shallow clone counts 1 commit, and a rewritten history can count
      # fewer than before. Either publishes a version below what users already
      # have, which silently stops updates. Equal is allowed — that is a re-run
      # of an already-published commit, handled by Publish release below.
      - name: Assert version moves forward
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep -Eo -- '-[0-9]+$' | tr -d - | sort -n | tail -1)
          if [ -z "$highest" ]; then
            echo "No published builds yet; nothing to compare against."
            exit 0
          fi
          build="${{ steps.version.outputs.build }}"
          echo "this build: $build, highest published: $highest"
          if [ "$build" -lt "$highest" ]; then
            echo "::error::Build number $build is lower than the published $highest. A shallow checkout or rewritten history would do this; publishing would stop updates for everyone already on $highest."
            exit 1
          fi

      - name: Codesign (ad-hoc)
        run: |
          app="build/Bro Computer.app"
          sparkle="$app/Contents/Frameworks/Sparkle.framework"

          # Sparkle signs from the inside out: its XPC services and helper
          # binaries first, then the framework wrapping them. Signing the
          # framework first would be invalidated by the nested signatures.
          # Deliberately no --deep, which Sparkle's docs warn against.
          codesign --force --sign - "$sparkle/Versions/B/XPCServices/Installer.xpc"
          codesign --force --sign - "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --sign - "$sparkle/Versions/B/Autoupdate"
          codesign --force --sign - "$sparkle/Versions/B/Updater.app"
          codesign --force --sign - "$sparkle"

          codesign --force --sign - "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          for helper in "$app/Contents/Frameworks/"*.app; do
            codesign --force --sign - "$helper"
          done
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Create DMG
        run: |
          staging=$(mktemp -d)
          ditto "build/Bro Computer.app" "$staging/Bro Computer.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Bro Computer" -srcfolder "$staging" \
            -ov -format UDZO "${{ steps.version.outputs.dmg }}"
          rm -rf "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dmg }}
          path: ${{ steps.version.outputs.dmg }}
          if-no-files-found: error

      # Immutable, one release per build. Sparkle's appcast points at these
      # URLs, so they must keep working after the next build lands — which is
      # why the old force-moved `latest` tag is gone. GitHub still resolves
      # /releases/latest to the newest of these, so the README link holds.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          dmg="${{ steps.version.outputs.dmg }}"
          # Idempotent: re-running an already-published commit (a retry after a
          # later step failed) must replace the asset rather than fail on an
          # existing tag. gh release create has no --clobber; upload does.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — replacing its asset."
            gh release upload "$tag" "$dmg" --clobber
          else
            printf '%s\n\n%s\n' \
              "Automated build from main (${{ github.sha }})." \
              "Ad-hoc signed, not notarized: on first launch right-click the app and choose Open." \
              > notes.md
            gh release create "$tag" \
              --title "${{ steps.version.outputs.short }} (build ${{ steps.version.outputs.build }})" \
              --notes-file notes.md \
              "$dmg"
          fi

      # Sign the DMG and republish the appcast Sparkle polls. Skipped with a
      # warning when SPARKLE_PRIVATE_KEY is absent, so the build keeps shipping
      # DMGs and updates switch on the moment the secret is added.
      - name: Publish appcast
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          pubkey=$(plutil -extract SUPublicEDKey raw "build/Bro Computer.app/Contents/Info.plist")
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [ "$pubkey" = "REPLACE_WITH_SPARKLE_PUBLIC_KEY" ]; then
              echo "::warning::SPARKLE_PRIVATE_KEY is not set — skipping appcast. Automatic updates stay off until it is added."
              exit 0
            fi
            # Real public key but no private key: the app WILL start Sparkle and
            # poll a feed this job never publishes. Fail here, where whoever
            # committed the key can see it, rather than on users' machines.
            echo "::error::SUPublicEDKey is set but SPARKLE_PRIVATE_KEY is missing. Shipped apps would poll an appcast that does not exist. Add the secret, or revert SUPublicEDKey to the placeholder."
            exit 1
          fi

          dmg="${{ steps.version.outputs.dmg }}"
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$dmg"

          # sign_update prints ready-to-paste enclosure attributes:
          #   sparkle:edSignature="..." length="..."
          keyfile=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$keyfile"
          attrs=$(build/_deps/sparkle-src/bin/sign_update "$dmg" --ed-key-file "$keyfile")
          rm -f "$keyfile"

          min_os=$(plutil -extract LSMinimumSystemVersion raw "build/Bro Computer.app/Contents/Info.plist")
          cat > appcast.xml <<XML
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
            <channel>
              <title>Bro Computer</title>
              <item>
                <title>${{ steps.version.outputs.short }} (build ${{ steps.version.outputs.build }})</title>
                <pubDate>$(date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>
                <sparkle:shortVersionString>${{ steps.version.outputs.short }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$min_os</sparkle:minimumSystemVersion>
                <enclosure url="$url" type="application/octet-stream" $attrs />
              </item>
            </channel>
          </rss>
          XML

          # One mutable release holds the feed. The URL must stay stable because
          # it is baked into every shipped app's Info.plist as SUFeedURL.
          if ! gh release view appcast >/dev/null 2>&1; then
            gh release create appcast --prerelease --title "Appcast" \
              --notes "Sparkle update feed. Managed by CI — do not delete, shipped apps poll this URL."
          fi
          gh release upload appcast appcast.xml --clobber
